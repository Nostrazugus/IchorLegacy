<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge d’Ichor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Marcellus+SC&display=swap">
<style>
/* Disposition : atelier sombre de lapis ; la Forge en deux colonnes (formulaire / fiche + contrôles),
   les registres en trois volets (tables / lignes / formulaire). L'or marque l'action principale. */
:root {
  --fond: #0E1433;
  --fond-2: #121a40;
  --panneau: #16204D;
  --panneau-2: #1C2759;
  --champ: #0F1738;
  --filet: #2B3A75;
  --filet-fort: #40519A;
  --texte: #ECE6D4;
  --brume: #A3ACCF;
  --pale: #737EAA;
  --or: #E4BB5D;
  --or-clair: #F5DD9C;
  --or-fonce: #9C7428;
  --sur-or: #141a38;
  --err: #F2907F;
  --err-fond: rgba(242, 144, 127, .12);
  --afaire: #E8C46C;
  --afaire-fond: rgba(232, 196, 108, .11);
  --info: #93B6F2;
  --info-fond: rgba(147, 182, 242, .11);
  --ok: #82D49E;
  --ok-fond: rgba(130, 212, 158, .11);
  --bronze: #C68B58;
  --argent: #C3CCE4;
  --orm: #E2B94F;
  --f-titre: 'Marcellus SC', 'Palatino Linotype', Georgia, serif;
  --f-texte: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  --f-code: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --ombre: 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --fond: #ECEFF7; --fond-2: #E3E7F2; --panneau: #FFFFFF; --panneau-2: #F4F6FB; --champ: #FFFFFF;
    --filet: #D3D9EA; --filet-fort: #AEB8D6; --texte: #17204A; --brume: #535E88; --pale: #8A92B3;
    --or: #946A12; --or-clair: #7A560B; --or-fonce: #946A12; --sur-or: #FFFFFF;
    --err: #B23D2C; --err-fond: rgba(178, 61, 44, .08); --afaire: #8A6200; --afaire-fond: rgba(196, 140, 0, .1);
    --info: #2F5DA8; --info-fond: rgba(47, 93, 168, .08); --ok: #2E7D4B; --ok-fond: rgba(46, 125, 75, .09);
    --bronze: #A0662F; --argent: #6C7896; --orm: #A67A10; --ombre: 0 10px 30px rgba(23, 32, 74, .12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --fond: #ECEFF7; --fond-2: #E3E7F2; --panneau: #FFFFFF; --panneau-2: #F4F6FB; --champ: #FFFFFF;
  --filet: #D3D9EA; --filet-fort: #AEB8D6; --texte: #17204A; --brume: #535E88; --pale: #8A92B3;
  --or: #946A12; --or-clair: #7A560B; --or-fonce: #946A12; --sur-or: #FFFFFF;
  --err: #B23D2C; --err-fond: rgba(178, 61, 44, .08); --afaire: #8A6200; --afaire-fond: rgba(196, 140, 0, .1);
  --info: #2F5DA8; --info-fond: rgba(47, 93, 168, .08); --ok: #2E7D4B; --ok-fond: rgba(46, 125, 75, .09);
  --bronze: #A0662F; --argent: #6C7896; --orm: #A67A10; --ombre: 0 10px 30px rgba(23, 32, 74, .12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fond); }
body { color: var(--texte); font-family: var(--f-texte); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-titre); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.mono, code { font-family: var(--f-code); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ── En-tête ── */
.entete { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--fond) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--filet); }
.entete-in { max-width: 1480px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 8px 22px; flex-wrap: wrap; min-height: 56px; }
.marque { display: flex; align-items: baseline; gap: 10px; }
.marque b { font-family: var(--f-titre); font-weight: 400; font-size: 22px; letter-spacing: .1em; color: var(--or); }
.marque span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--brume); }
.onglets { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.onglets button { border: 0; background: none; padding: 16px 12px 14px; cursor: pointer; color: var(--brume); border-bottom: 2px solid transparent; font-size: 15px; }
.onglets button:hover { color: var(--texte); }
.onglets button[aria-current="page"] { color: var(--or-clair); border-bottom-color: var(--or); }
.onglets .compte { font-size: 12px; color: var(--pale); margin-left: 4px; }
.source { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--filet); background: var(--panneau); cursor: pointer; font-size: 13px; }
.source i { width: 8px; height: 8px; border-radius: 50%; background: var(--pale); }
.source.local i { background: var(--info); }
.source.connecte i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.source.deconnecte i { background: var(--err); }

.vue { max-width: 1480px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
.vue-tete { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 16px; }
.vue-tete h1 { font-size: 26px; color: var(--or-clair); }
.vue-tete .sous { color: var(--brume); font-size: 14px; }
.vue-tete .espace { flex: 1; }
.bandeau { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; border: 1px solid var(--filet); background: var(--panneau); }
.bandeau.err { border-color: color-mix(in srgb, var(--err) 50%, transparent); background: var(--err-fond); }
.bandeau.info { border-color: color-mix(in srgb, var(--info) 45%, transparent); background: var(--info-fond); }
.bandeau.afaire { border-color: color-mix(in srgb, var(--afaire) 45%, transparent); background: var(--afaire-fond); }

/* ── Contrôles de formulaire ── */
input[type="text"], input[type="search"], input[type="password"], input[type="email"], input[type="number"], select, textarea {
  background: var(--champ); border: 1px solid var(--filet); border-radius: 5px; padding: 7px 10px; min-height: 36px; width: 100%; min-width: 0;
}
textarea { min-height: 70px; resize: vertical; line-height: 1.4; }
select { cursor: pointer; }
input:hover, select:hover, textarea:hover { border-color: var(--filet-fort); }
input:focus, select:focus, textarea:focus { border-color: var(--or); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--or) 25%, transparent); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--or); width: 16px; height: 16px; margin: 0; }
input[type="color"] { width: 42px; height: 36px; padding: 2px; border: 1px solid var(--filet); border-radius: 5px; background: var(--champ); cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 6px 14px; border-radius: 5px; border: 1px solid var(--filet-fort); background: var(--panneau-2); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--or); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.prim { background: linear-gradient(180deg, var(--or-clair), var(--or)); border-color: var(--or-fonce); color: var(--sur-or); font-weight: 700; }
:root[data-theme="light"] .btn.prim { background: var(--or); }
.btn.prim:hover:not(:disabled) { filter: brightness(1.06); }
.btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 55%, transparent); background: transparent; }
.btn.danger.arme { background: var(--err); color: var(--sur-or); }
.btn.discret { background: transparent; border-color: transparent; color: var(--brume); }
.btn.discret:hover:not(:disabled) { color: var(--texte); border-color: var(--filet); }
.btn svg, .ic svg { width: 16px; height: 16px; flex: none; }
.ic { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 5px; border: 1px solid var(--filet); background: var(--panneau-2); cursor: pointer; color: var(--brume); flex: none; }
.ic:hover { color: var(--texte); border-color: var(--filet-fort); }
.ic.actif { color: var(--sur-or); background: var(--or); border-color: var(--or-fonce); }
.outils { display: inline-flex; gap: 4px; }

/* ── Forge ── */
.forge { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1100px) { .forge { grid-template-columns: minmax(0, 1fr); } }
.forge-form { display: grid; gap: 14px; min-width: 0; }
.forge-cote { display: grid; gap: 14px; min-width: 0; position: sticky; top: 72px; max-height: calc(100vh - 84px); overflow: auto; padding-right: 2px; }
@media (max-width: 1100px) { .forge-cote { position: static; max-height: none; overflow: visible; } }
.barre-forge { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 8px; background: var(--panneau); border: 1px solid var(--filet); }
.barre-forge h1 { font-size: 22px; color: var(--or-clair); }
.barre-forge .id { font-family: var(--f-code); font-size: 13px; color: var(--brume); }
.barre-forge .modifie { font-size: 13px; color: var(--afaire); display: inline-flex; align-items: center; gap: 6px; }
.barre-forge .modifie::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--afaire); }
.barre-forge .espace { flex: 1; }
.bloc { padding: 14px 16px 16px; border-radius: 8px; background: var(--panneau); border: 1px solid var(--filet); display: grid; gap: 12px; }
.bloc-tete { display: flex; align-items: baseline; gap: 8px 12px; flex-wrap: wrap; }
.bloc-tete h2 { font-size: 17px; color: var(--texte); }
.bloc-tete .aide { font-size: 13px; color: var(--brume); }
.bloc-tete .espace { flex: 1; }
.rangee { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; }
.rangee > label, .rangee > .lib { font-size: 13px; color: var(--brume); }
@media (max-width: 560px) { .rangee { grid-template-columns: minmax(0, 1fr) auto; } .rangee > label, .rangee > .lib { grid-column: 1 / -1; } }
.sous-ligne { grid-column: 2 / -1; font-size: 13px; color: var(--brume); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: -2px; }
@media (max-width: 560px) { .sous-ligne { grid-column: 1 / -1; } }
.sous-ligne .note { color: var(--afaire); }
.deux { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .deux { grid-template-columns: minmax(0, 1fr); } }
.champ { display: grid; gap: 4px; min-width: 0; }
.champ > span { font-size: 13px; color: var(--brume); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--filet); background: var(--champ); border-radius: 5px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
.seg button[aria-pressed="true"] { border-color: var(--or); background: color-mix(in srgb, var(--or) 14%, var(--champ)); }
.seg.petit button { padding: 3px 10px; min-height: 30px; font-size: 13px; }

.elev { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
.elev .pips { font-size: 10px; letter-spacing: 1px; color: var(--bronze); }
.elev.e2 .pips { color: var(--argent); }
.elev.e3 .pips { color: var(--orm); }
.elev.e4 .pips { background: linear-gradient(90deg, #F6CF4F, #F2A9C9, #8FD3E8); -webkit-background-clip: text; background-clip: text; color: transparent; }

.puce { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 13px; border: 1px solid color-mix(in srgb, var(--c, var(--brume)) 50%, transparent); background: color-mix(in srgb, var(--c, var(--brume)) 12%, transparent); white-space: nowrap; }
.puce::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--brume)); }
.puce.sans::before { display: none; }
.puces { display: flex; flex-wrap: wrap; gap: 5px; }

.slot { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto auto; gap: 8px 10px; align-items: center; }
@media (max-width: 640px) { .slot { grid-template-columns: minmax(0, 1fr) auto; } .slot .slot-elev { grid-column: 1 / -1; } .slot .bascule { grid-column: 1 / 2; } }
.bascule { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--brume); cursor: pointer; white-space: nowrap; }

.stats-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.stat-champ { display: grid; gap: 3px; }
.stat-champ span { font-size: 12px; color: var(--brume); display: flex; justify-content: space-between; gap: 6px; }
.stat-champ span b { color: var(--texte); font-weight: 700; letter-spacing: .04em; }
.stat-champ input { text-align: right; font-variant-numeric: tabular-nums; }
.stat-champ.alerte input { border-color: var(--afaire); }

.ajout-nom { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; padding: 10px; border-radius: 6px; background: var(--fond-2); border: 1px dashed var(--filet-fort); }
@media (max-width: 640px) { .ajout-nom { grid-template-columns: minmax(0, 1fr); } }

/* Fiche */
.fiche { --pc: var(--or); padding: 18px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--pc) 45%, var(--filet)); background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 13%, var(--panneau)), var(--panneau) 55%); display: grid; gap: 10px; }
.fiche-sur { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--brume); }
.fiche h2 { font-size: 30px; line-height: 1.05; }
.fiche h2.sans { color: var(--pale); }
.fiche-enfant { font-size: 16px; }
.fiche-enfant span { color: var(--brume); font-size: 14px; margin-left: 6px; }
.fiche dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 14px; }
.fiche dt { color: var(--brume); }
.fiche dd { margin: 0; }
.fiche-pouvoirs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.fiche-pouvoirs li { padding: 8px 10px 9px; border-radius: 6px; background: color-mix(in srgb, var(--fond) 55%, transparent); border-left: 3px solid var(--c, var(--filet)); display: grid; gap: 2px; }
.fiche-pouvoirs .emp { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--brume); }
.fiche-pouvoirs b { font-family: var(--f-titre); font-weight: 400; font-size: 16px; }
.fiche-pouvoirs .meta { font-size: 13px; color: var(--brume); }
.fiche-pouvoirs p { font-size: 13.5px; }
.fiche-pouvoirs .vide { color: var(--pale); font-style: italic; }

/* Messages de contrôle */
.panneau { padding: 14px 16px; border-radius: 8px; background: var(--panneau); border: 1px solid var(--filet); display: grid; gap: 10px; }
.panneau > h3 { font-size: 16px; display: flex; align-items: baseline; gap: 10px; }
.panneau > h3 small { font-family: var(--f-texte); font-size: 13px; color: var(--brume); }
.msgs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.msgs li { padding: 7px 10px 7px 12px; border-radius: 5px; font-size: 14px; border-left: 3px solid; }
.msgs li.erreur { background: var(--err-fond); border-color: var(--err); }
.msgs li.afaire { background: var(--afaire-fond); border-color: var(--afaire); }
.msgs li.alerte { background: var(--info-fond); border-color: var(--info); }
.msgs li.ok { background: var(--ok-fond); border-color: var(--ok); }

.comp { display: grid; gap: 9px; }
.comp-l { display: grid; grid-template-columns: 70px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13px; }
.comp-l .v { text-align: right; font-variant-numeric: tabular-nums; }
.comp-barre { position: relative; height: 18px; }
.comp-barre .plage { position: absolute; top: 7px; height: 4px; border-radius: 2px; background: var(--filet-fort); }
.comp-barre .med { position: absolute; top: 3px; width: 2px; height: 12px; background: var(--brume); }
.comp-barre .moi { position: absolute; top: 2px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--or); border: 2px solid var(--panneau); }
.legende-comp { font-size: 12px; color: var(--brume); display: flex; gap: 14px; flex-wrap: wrap; }
.legende-comp i { display: inline-block; vertical-align: middle; margin-right: 5px; }

/* ── Tableaux ── */
.tab-wrap { overflow-x: auto; border: 1px solid var(--filet); border-radius: 8px; background: var(--panneau); }
.tab { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
.tab th, .tab td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--filet); vertical-align: middle; }
.tab th { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--brume); background: var(--panneau-2); position: sticky; top: 0; }
.tab tbody tr:hover { background: color-mix(in srgb, var(--or) 5%, transparent); }
.tab tbody tr:last-child td { border-bottom: 0; }
.tab .lien { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 700; text-align: left; color: var(--texte); }
.tab .lien:hover { color: var(--or-clair); text-decoration: underline; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .03em; border: 1px solid; }
.pill.brouillon { color: var(--brume); border-color: var(--filet-fort); }
.pill.valide { color: var(--info); border-color: color-mix(in srgb, var(--info) 55%, transparent); }
.pill.en_jeu { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: var(--ok-fond); }
.pill.retire { color: var(--pale); border-color: var(--filet); text-decoration: line-through; }
.marque-ctrl { display: inline-flex; gap: 6px; font-size: 13px; }
.marque-ctrl .e { color: var(--err); }
.marque-ctrl .a { color: var(--afaire); }
.filtres { display: grid; grid-template-columns: minmax(180px, 2fr) repeat(4, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
@media (max-width: 900px) { .filtres { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ── Listes ── */
.listes { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .listes { grid-template-columns: minmax(0, 1fr); } }
.listes-nav { display: grid; gap: 14px; position: sticky; top: 72px; }
@media (max-width: 900px) { .listes-nav { position: static; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
.listes-nav h3 { font-family: var(--f-texte); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--pale); margin-bottom: 4px; }
.listes-nav button { display: flex; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; text-align: left; color: var(--brume); }
.listes-nav button:hover { background: var(--panneau); color: var(--texte); }
.listes-nav button[aria-current="true"] { background: var(--panneau-2); color: var(--or-clair); }
.listes-nav button span { font-size: 12px; color: var(--pale); font-variant-numeric: tabular-nums; }
.listes-corps { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(0, 1.5fr); gap: 16px; align-items: start; }
@media (max-width: 1150px) { .listes-corps { grid-template-columns: minmax(0, 1fr); } }
.lignes { display: grid; gap: 2px; max-height: calc(100vh - 190px); overflow: auto; padding: 4px; border: 1px solid var(--filet); border-radius: 8px; background: var(--panneau); }
@media (max-width: 1150px) { .lignes { max-height: 360px; } }
.lignes button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; border: 0; background: none; padding: 7px 10px; border-radius: 5px; cursor: pointer; text-align: left; }
.lignes button:hover { background: var(--panneau-2); }
.lignes button[aria-current="true"] { background: color-mix(in srgb, var(--or) 14%, var(--panneau)); }
.lignes .l1 { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lignes .l2 { font-size: 12px; color: var(--brume); grid-column: 1 / -1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lignes .idm { font-family: var(--f-code); font-size: 12px; color: var(--pale); }
.lignes .en { width: 7px; height: 7px; border-radius: 50%; background: var(--afaire); display: inline-block; margin-left: 6px; vertical-align: middle; }
.lignes .rien { padding: 16px; color: var(--brume); font-size: 14px; }
.formulaire { display: grid; gap: 12px; padding: 16px; border-radius: 8px; background: var(--panneau); border: 1px solid var(--filet); }
.formulaire-tete { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.formulaire-tete h2 { font-size: 20px; color: var(--or-clair); }
.formulaire-tete .mono { color: var(--brume); }
.grille-champs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
@media (max-width: 640px) { .grille-champs { grid-template-columns: minmax(0, 1fr); } }
.grille-champs .large { grid-column: 1 / -1; }
.champ .ro { padding: 7px 10px; border-radius: 5px; border: 1px dashed var(--filet); color: var(--brume); font-family: var(--f-code); font-size: 13px; min-height: 36px; display: flex; align-items: center; }
.coche { display: flex; align-items: center; gap: 8px; min-height: 36px; cursor: pointer; }
.choix-multi { display: flex; flex-wrap: wrap; gap: 6px; }
.choix-multi button { border: 1px solid var(--filet); background: var(--champ); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 13px; }
.choix-multi button[aria-pressed="true"] { border-color: var(--c, var(--or)); background: color-mix(in srgb, var(--c, var(--or)) 18%, var(--champ)); }
.pivot { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pivot label { display: grid; gap: 3px; font-size: 12px; color: var(--brume); }
.apercu { padding: 8px 12px; border-radius: 5px; background: var(--fond-2); font-size: 14px; }
.sous-liste { display: grid; gap: 6px; }
.sous-liste h3 { font-family: var(--f-texte); font-size: 13px; font-weight: 700; color: var(--brume); letter-spacing: .06em; text-transform: uppercase; }
.sous-liste ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.sous-liste li button { border: 0; background: var(--fond-2); border-radius: 5px; padding: 6px 10px; cursor: pointer; width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 10px; }
.sous-liste li button:hover { background: var(--panneau-2); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .espace { flex: 1; }
.vide-etat { padding: 28px 20px; border-radius: 8px; border: 1px dashed var(--filet-fort); color: var(--brume); display: grid; gap: 10px; justify-items: start; }
.vide-etat h2 { font-size: 19px; color: var(--texte); }

/* ── Échanges, contrôles, réglages ── */
.cartes { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
.depot { border: 2px dashed var(--filet-fort); border-radius: 8px; padding: 22px; text-align: center; color: var(--brume); display: grid; gap: 10px; justify-items: center; }
.depot.survol { border-color: var(--or); background: color-mix(in srgb, var(--or) 7%, transparent); }
.fichiers { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.fichiers li { display: grid; grid-template-columns: minmax(0, 1fr) 190px auto; gap: 8px; align-items: center; font-size: 14px; }
.rapport { display: grid; gap: 8px; }
.rapport-l { padding: 10px 12px; border-radius: 6px; background: var(--fond-2); display: grid; gap: 6px; }
.rapport-l .chiffres { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--brume); }
.rapport-l .chiffres b { color: var(--texte); }
.export-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.export-grille button { justify-content: space-between; }
.liste-ctrl { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.liste-ctrl li { display: flex; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--filet); }
.liste-ctrl li:last-child { border-bottom: 0; }
.liste-ctrl .lien { border: 0; background: none; padding: 0; cursor: pointer; color: var(--or-clair); font-weight: 700; }
.liste-ctrl .lien:hover { text-decoration: underline; }
.liste-ctrl small { color: var(--brume); }
.radios { display: grid; gap: 8px; }
.radios label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--filet); cursor: pointer; }
.radios label:has(input:checked) { border-color: var(--or); background: color-mix(in srgb, var(--or) 8%, transparent); }
.radios small { display: block; color: var(--brume); font-size: 13px; }
.mono-bloc { font-family: var(--f-code); font-size: 12.5px; padding: 10px 12px; border-radius: 5px; background: var(--fond-2); overflow-x: auto; white-space: pre; }

/* ── Notifications ── */
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 32px)); }
.toast { padding: 10px 14px; border-radius: 6px; background: var(--panneau-2); border: 1px solid var(--filet-fort); box-shadow: var(--ombre); font-size: 14px; border-left: 4px solid var(--ok); }
.toast.erreur { border-left-color: var(--err); }
.toast.info { border-left-color: var(--info); }
.voile { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: color-mix(in srgb, var(--fond) 70%, transparent); }
.voile div { padding: 16px 22px; border-radius: 8px; background: var(--panneau); border: 1px solid var(--filet-fort); box-shadow: var(--ombre); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: entree .2s ease-out; } @keyframes entree { from { opacity: 0; transform: translateY(6px); } } }

</style>
</head>
<body>
<header class="entete">
  <div class="entete-in">
    <div class="marque"><b>Forge</b><span>Héritiers d’Ichor</span></div>
    <nav class="onglets" id="onglets" aria-label="Sections"></nav>
    <button class="source" id="source" data-a="aller" data-v="reglages" title="Source des données"></button>
  </div>
</header>
<main class="vue" id="vue"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="voile" id="voile" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   Forge d’Ichor · couche de données
   Métadonnées des registres, validations (miroir de schema.sql),
   base locale, adaptateur Supabase, échanges TSV et build JSON.
   ═══════════════════════════════════════════════════════════════ */

/* ── Utilitaires ── */
const vide = v => v === null || v === undefined || v === '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nombreFr = v => (vide(v) ? '' : String(v).replace('.', ','));
function lireNombre(s) {
  if (vide(s)) return null;
  if (typeof s === 'number') return s;
  const t = String(s).trim().replace(/[\s  ]/g, '').replace(',', '.');
  if (t === '') return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : NaN;
}
function lireBool(s) {
  if (typeof s === 'boolean') return s;
  const v = String(s ?? '').trim().toLowerCase();
  if (['oui', 'vrai', 'true', '1', 'yes', 'x'].includes(v)) return true;
  if (['non', 'faux', 'false', '0', 'no', ''].includes(v)) return false;
  return null;
}
const piocher = a => (a && a.length ? a[Math.floor(Math.random() * a.length)] : null);
const copie = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
const maintenant = () => new Date().toISOString();
const arrondi = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);

class ErreurForge extends Error {
  constructor(messages) {
    const l = Array.isArray(messages) ? messages : [messages];
    super(l.join(' '));
    this.messages = l;
  }
}

/* ── Colonnes ── */
const C = {
  slug: () => ({ n: 'id', l: 'Identifiant', t: 'slug', req: true }),
  auto: (prefixe, chiffres) => ({ n: 'id', l: 'Identifiant', t: 'auto', prefixe, chiffres }),
  txt: (n, l, o = {}) => ({ n, l, t: 'texte', ...o }),
  long: (n, l, o = {}) => ({ n, l, t: 'long', ...o }),
  int: (n, l, o = {}) => ({ n, l, t: 'entier', ...o }),
  num: (n, l, o = {}) => ({ n, l, t: 'nombre', ...o }),
  bool: (n, l, o = {}) => ({ n, l, t: 'bool', def: false, ...o }),
  enu: (n, l, vals, o = {}) => ({ n, l, t: 'enum', vals, ...o }),
  ref: (n, l, table, o = {}) => ({ n, l, t: 'ref', table, ...o }),
  couleur: () => ({ n: 'couleur', l: 'Couleur', t: 'couleur' }),
  liste: (n, l, table, j) => ({ n, l, t: 'liste', table, virt: true, ...j }),
  pivot: (n, l, table, j) => ({ n, l, t: 'pivot', table, virt: true, ...j }),
  poly: (n, l, choix, o = {}) => ({ n, l, t: 'poly', choix, virt: !o.reel, ...o }),
};
const NOMS = [C.txt('nom_fr', 'Nom (FR)', { req: true }), C.txt('nom_en', 'Nom (EN)', { en: true })];
const DESC = [C.long('description_fr', 'Description (FR)'), C.long('description_en', 'Description (EN)', { en: true })];

const LS_ENTITE = { t: 'liste', jonction: 'entite_spheres', fk: 'entite_id', vers: 'sphere_id' };
const LS_ORIGINE = { t: 'liste', jonction: 'origine_pantheons', fk: 'origine_id', vers: 'pantheon_id' };
const PV_VOCATION = { t: 'pivot', jonction: 'vocation_profils', fk: 'vocation_id', vers: 'stat_id', val: 'poids' };

const SOURCES_MODIF = {
  vocation: { col: 'vocation_id', table: 'vocations', l: 'Vocation' },
  sphere: { col: 'sphere_id', table: 'spheres', l: 'Sphère' },
  elevation: { col: 'elevation_id', table: 'elevations', l: 'Élévation' },
  type: { col: 'type_id', table: 'types_heritage', l: 'Type d’héritage' },
  pouvoir: { col: 'pouvoir_id', table: 'pouvoirs', l: 'Passif', filtre: r => r.emplacement === 'passif', refus: 'seul un passif peut être une source.' },
  palier: { col: 'palier_id', table: 'synergie_paliers', l: 'Palier de synergie' },
};

/* ── Registres ── */
const META = {
  elevations: {
    titre: 'Élévations', dom: 'Héritage', tri: (a, b) => a.ordre - b.ordre,
    cols: [C.slug(), ...NOMS, C.int('ordre', 'Ordre', { req: true, min: 1 }), C.int('nb_spheres', 'Sphères débloquées (cumul)', { req: true, min: 1 }),
      C.int('spheres_libres', 'Sphères libres, choisies en jeu', { req: true, min: 0, def: 0 }), C.num('ip_cible', 'IP cible'),
      C.num('tolerance_ip', 'Tolérance IP', { min: 0 }), C.num('taux_invocation', 'Taux d’invocation (0 à 1)', { min: 0, max: 1 }),
      C.int('fragments_requis', 'Fragments requis', { min: 0 }), ...DESC],
    uniques: [['ordre']],
  },
  ecarts_elevation: {
    titre: 'Écarts d’élévation', dom: 'Héritage',
    cols: [C.ref('depart_id', 'Élévation de départ', 'elevations', { req: true }), C.ref('atteinte_id', 'Élévation atteinte', 'elevations', { req: true }),
      C.num('coefficient', 'Coefficient', { req: true, min: 0, minExcl: true, def: 1 })],
    lib: (r, B) => `${libId(B, 'elevations', r.depart_id)} → ${libId(B, 'elevations', r.atteinte_id)}`,
    tri: (a, b, B) => (ordreElev(B, a.depart_id) - ordreElev(B, b.depart_id)) || (ordreElev(B, a.atteinte_id) - ordreElev(B, b.atteinte_id)),
    verif: (E, B) => {
      const a = B.get('elevations', E.depart_id), b = B.get('elevations', E.atteinte_id);
      return a && b && b.ordre < a.ordre ? ['L’élévation atteinte précède l’élévation de départ.'] : [];
    },
  },
  pantheons: { titre: 'Panthéons', dom: 'Héritage', cols: [C.slug(), ...NOMS, C.couleur(), ...DESC] },
  types_heritage: { titre: 'Types d’héritage', dom: 'Héritage', cols: [C.slug(), ...NOMS, ...DESC] },
  entites: {
    titre: 'Entités parentes', dom: 'Héritage',
    cols: [C.auto('ENT-', 4), ...NOMS,
      C.enu('genre', 'Genre', [['M', 'Masculin'], ['F', 'Féminin'], ['N', 'Neutre']], { req: true }),
      C.enu('determinant_fr', 'Déterminant (FR)', [['aucun', 'aucun'], ['le', 'le'], ['la', 'la'], ['l', 'l’'], ['les', 'les']], { req: true, def: 'aucun' }),
      C.bool('elision_fr', 'Élision (FR) : « d’… »'),
      C.enu('article_en', 'Article (EN)', [['aucun', 'aucun'], ['the', 'the']], { req: true, def: 'aucun' }),
      C.txt('forme_de_fr', 'Surcharge de « de … » (FR)'), C.txt('forme_de_en', 'Surcharge de « of … » (EN)'),
      C.ref('pantheon_id', 'Panthéon', 'pantheons', { req: true }), C.ref('type_id', 'Type', 'types_heritage', { req: true }),
      C.liste('spheres', 'Sphères héritables', 'spheres', { jonction: 'entite_spheres', fk: 'entite_id', vers: 'sphere_id' }), ...DESC],
    uniques: [['nom_fr', 'pantheon_id']],
    apercu: E => `${enfantDeFr(E)} · ${enfantDeEn(E)}`,
    calc: (r) => ({ calc_enfant_de_fr: enfantDeFr(r), calc_enfant_de_en: enfantDeEn(r) }),
  },
  origines: {
    titre: 'Origines des noms', dom: 'Héritage',
    cols: [C.slug(), ...NOMS, C.bool('universelle', 'Universelle (acceptée par tous les panthéons)'),
      C.liste('pantheons', 'Panthéons qui l’acceptent', 'pantheons', { jonction: 'origine_pantheons', fk: 'origine_id', vers: 'pantheon_id' })],
  },
  noms: {
    titre: 'Noms', dom: 'Héritage',
    cols: [C.auto('NOM-', 5), C.txt('nom', 'Nom', { req: true }), C.txt('nom_en', 'Nom (EN), si différent'),
      C.ref('origine_id', 'Origine', 'origines', { req: true }),
      C.enu('genre', 'Genre', [['M', 'Masculin'], ['F', 'Féminin'], ['E', 'Épicène']], { req: true })],
    uniques: [['nom', 'origine_id']],
    lib: r => r.nom,
    tri: (a, b) => a.nom.localeCompare(b.nom, 'fr'),
  },
  spheres: { titre: 'Sphères', dom: 'Héritage', cols: [C.slug(), ...NOMS, C.couleur(), ...DESC] },
  vocations: {
    titre: 'Vocations', dom: 'Héritage',
    cols: [C.slug(), ...NOMS, ...DESC,
      C.pivot('profil', 'Profil de stats (bouton Auto)', 'stats', { jonction: 'vocation_profils', fk: 'vocation_id', vers: 'stat_id', val: 'poids', min: 0 })],
  },
  stats: {
    titre: 'Statistiques', dom: 'Héritage', tri: (a, b) => (a.ordre ?? 99) - (b.ordre ?? 99),
    cols: [C.slug(), ...NOMS, C.txt('abreviation_fr', 'Abréviation (FR)'), C.txt('abreviation_en', 'Abréviation (EN)', { en: true }),
      C.txt('unite', 'Unité'), C.num('valeur_ref', 'Valeur de référence'), C.num('min', 'Minimum'), C.num('max', 'Maximum'),
      C.num('poids_ip', 'Poids dans l’IP'), C.int('ordre', 'Ordre')],
    verif: E => (!vide(E.min) && !vide(E.max) && E.min > E.max ? ['Le minimum dépasse le maximum.'] : []),
  },
  ciblages: {
    titre: 'Ciblages', dom: 'Héritage',
    cols: [C.slug(), ...NOMS, C.enu('camp', 'Camp', [['ennemi', 'Ennemi'], ['allie', 'Allié'], ['soi', 'Soi']], { req: true }),
      C.txt('regle', 'Règle (code)'), ...DESC],
  },
  pouvoirs: {
    titre: 'Pouvoirs', dom: 'Pouvoirs',
    cols: [C.auto('POU-', 4), ...NOMS,
      C.enu('emplacement', 'Emplacement', [['passif', 'Passif'], ['pouvoir', 'Pouvoir'], ['ultime', 'Ultime']], { req: true, fige: true }),
      C.ref('sphere_id', 'Sphère', 'spheres', { req: true }),
      C.ref('declencheur_id', 'Déclencheur', 'declencheurs', { si: E => E.emplacement === 'passif' }),
      C.num('declencheur_valeur', 'Valeur du déclencheur', { si: E => E.emplacement === 'passif' }),
      C.num('recharge_s', 'Recharge (s)', { min: 0, minExcl: true, si: E => E.emplacement === 'pouvoir' }),
      C.num('energie_requise', 'Énergie requise', { min: 0, minExcl: true, si: E => E.emplacement === 'ultime' }),
      C.long('texte_modele_fr', 'Texte (FR)'), C.long('texte_modele_en', 'Texte (EN)', { en: true }),
      C.enu('statut', 'Statut', [['brouillon', 'Brouillon'], ['valide', 'Validé']], { req: true, def: 'brouillon' })],
    prefixe: E => ({ passif: 'PAS-', pouvoir: 'POU-', ultime: 'ULT-' }[E.emplacement] || 'POU-'),
    enfants: [{ table: 'effets', fk: 'pouvoir_id', titre: 'Effets' }],
    verif: E => {
      const e = [];
      if (E.emplacement === 'passif' && vide(E.declencheur_id)) e.push('Un passif a besoin d’un déclencheur.');
      if (E.emplacement === 'pouvoir' && vide(E.recharge_s)) e.push('Un pouvoir a besoin d’un temps de recharge.');
      if (E.emplacement === 'ultime' && vide(E.energie_requise)) e.push('Un ultime a besoin d’une énergie requise.');
      return e;
    },
    lib: r => r.nom_fr,
  },
  effets: {
    titre: 'Effets', dom: 'Pouvoirs',
    cols: [C.auto('EFF-', 5), C.ref('pouvoir_id', 'Pouvoir', 'pouvoirs', { req: true }), C.int('ordre', 'Ordre', { req: true, min: 1 }),
      C.ref('type_effet_id', 'Type d’effet', 'types_effet', { req: true }), C.ref('ciblage_id', 'Ciblage (vide : ciblage favori)', 'ciblages'),
      C.txt('condition', 'Condition'),
      C.liste('etiquettes', 'Étiquettes', 'etiquettes', { jonction: 'effet_etiquettes', fk: 'effet_id', vers: 'etiquette_id' }),
      C.pivot('p', 'Paramètres', 'parametres_effet', { jonction: 'effet_parametres', fk: 'effet_id', vers: 'parametre_id', val: 'valeur' })],
    uniques: [['pouvoir_id', 'ordre']],
    lib: (r, B) => `${libId(B, 'pouvoirs', r.pouvoir_id)} · effet ${r.ordre}`,
    tri: (a, b) => (a.pouvoir_id || '').localeCompare(b.pouvoir_id || '') || a.ordre - b.ordre,
  },
  declencheurs: { titre: 'Déclencheurs', dom: 'Pouvoirs', cols: [C.slug(), ...NOMS, C.txt('unite_valeur', 'Unité de la valeur'), ...DESC] },
  types_effet: { titre: 'Types d’effet', dom: 'Pouvoirs', cols: [C.slug(), ...NOMS, ...DESC] },
  parametres_effet: { titre: 'Paramètres d’effet', dom: 'Pouvoirs', cols: [C.slug(), ...NOMS, C.txt('unite', 'Unité'), ...DESC] },
  etiquettes: { titre: 'Étiquettes', dom: 'Pouvoirs', cols: [C.slug(), ...NOMS, ...DESC] },
  modificateurs: {
    titre: 'Modificateurs', dom: 'Modificateurs',
    cols: [C.auto('MOD-', 4),
      C.poly('source', 'Source', SOURCES_MODIF, { req: true, tsvType: 'source_type', tsvId: 'source_id' }),
      C.poly('cible', 'Cible', { stat: { col: 'stat_id', table: 'stats', l: 'Stat' }, parametre: { col: 'parametre_id', table: 'parametres_effet', l: 'Paramètre d’effet' } },
        { req: true, tsvType: 'cible_type', tsvId: 'cible_id' }),
      C.ref('etiquette_id', 'Filtre par étiquette', 'etiquettes', { si: E => (E.cible || {}).type === 'parametre' }),
      C.enu('portee', 'Portée', [['heritier', 'Héritier'], ['sphere', 'Pouvoirs de la sphère source'], ['equipe', 'Équipe']], { req: true, def: 'heritier' }),
      C.enu('operation', 'Opération', [['ajout', 'Ajout'], ['multiplication', 'Multiplication'], ['remplacement', 'Remplacement']], { req: true }),
      C.num('valeur', 'Valeur', { req: true }), C.txt('condition', 'Condition'), ...DESC],
    verif: E => (E.portee === 'sphere' && (E.source || {}).type !== 'sphere' ? ['La portée « sphère » demande une sphère comme source.'] : []),
    lib: (r, B) => {
      const E = versEdition(B, 'modificateurs', r);
      const s = E.source.type ? libId(B, SOURCES_MODIF[E.source.type].table, E.source.id) : '?';
      const c = E.cible.type === 'stat' ? libId(B, 'stats', E.cible.id) : E.cible.type === 'parametre' ? libId(B, 'parametres_effet', E.cible.id) : '?';
      const op = { ajout: '+', multiplication: '×', remplacement: '=' }[r.operation] || '';
      return `${s} → ${c} ${op}${nombreFr(r.valeur)}`;
    },
  },
  synergies: {

    if (!B.get('elevations', s.elevation_id)) err('spheres', `Élévation « ${s.elevation_id} » introuvable.`);
    if (vus.has(s.sphere_id)) err('spheres', `La sphère ${libId(B, 'spheres', s.sphere_id)} est choisie deux fois.`);
    vus.add(s.sphere_id);
  }
  for (const [k, v] of Object.entries(H.stats || {})) {

    if (!vide(st.min) && v < st.min) alerte('stat_' + k, `${st.nom_fr} sous son minimum (${nombreFr(st.min)}).`);

  if (manque.length) strict('fiche', `À compléter : ${manque.join(', ')}.`);
  for (const e of [...B.rows('elevations')].sort((a, b) => a.ordre - b.ordre)) {
    const nb = sph.filter(s => ordreElev(B, s.elevation_id) <= e.ordre).length;
    if (nb !== e.nb_spheres) { strict('spheres', `${nb} sphère${nb > 1 ? 's' : ''} débloquée${nb > 1 ? 's' : ''} en ${e.nom_fr}, ${e.nb_spheres} attendue${e.nb_spheres > 1 ? 's' : ''}.`); break; }
  }
  if (ent && sph.length) {
    const herit = new Set(B.liste(LS_ENTITE, ent.id));
    if (!sph.some(s => herit.has(s.sphere_id))) strict('spheres', `Aucune sphère n’est héritée de ${ent.nom_fr}.`);
  }
  const ens = new Set(sph.map(s => s.sphere_id));
  for (const [c, , l] of CHAMPS_POUVOIRS) {
    const p = B.get('pouvoirs', H[c]);
    if (p && !ens.has(p.sphere_id)) strict(c, `${l} : ${p.nom_fr} relève de la sphère ${libId(B, 'spheres', p.sphere_id)}, qui n’est pas l’une des siennes.`);
  }
  return out;
}

function nouvelId(B, t, E, compteurs) {
  let pre, chiffres;
  if (t === 'heritiers') { pre = 'HER-'; chiffres = 4; }
  else { const m = META[t], c = m.cols.find(x => x.t === 'auto'); pre = m.prefixe ? m.prefixe(E) : c.prefixe; chiffres = c.chiffres; }
  const nums = B.rows(t).map(r => r.id).filter(id => id && id.startsWith(pre)).map(id => parseInt(id.slice(pre.length), 10)).filter(Number.isFinite);
  const n = Math.max(compteurs[pre] || 0, 0, ...nums) + 1;
  compteurs[pre] = n;
  return pre + String(n).padStart(chiffres, '0');
}
function appliquerLigne(B, t, row, jonctions, ancienne, opts = {}) {
  const avant = vide(ancienne) ? null : B.get(t, ancienne);
  if (META[t].cols[0].t === 'auto' && vide(row.id)) row.id = nouvelId(B, t, row, opts.compteurs || {});
  const k = cleDe(t, row);
  if (avant && ancienne !== k) B.retirer(t, ancienne);
  const date = maintenant();
  const final = { ...row, cree_le: (avant && avant.cree_le) || row.cree_le || date, modifie_le: row.modifie_le || date };
  B.poser(t, final);
  const jav = {};
  for (const j of jonctions || []) {
    const s = j.spec;
    jav[s.n] = s.t === 'pivot' ? B.pivot(s, k) : B.liste(s, k);
    const lignes = s.t === 'pivot'
      ? Object.entries(j.valeurs).map(([x, v]) => ({ [s.fk]: k, [s.vers]: x, [s.val]: v }))
      : j.valeurs.map(x => ({ [s.fk]: k, [s.vers]: x }));
    B.remplacerEnfants(s.jonction, s.fk, k, lignes);
    if (avant && ancienne !== k) B.remplacerEnfants(s.jonction, s.fk, ancienne, []);
  }
  if (opts.journal) {
    const champs = avant ? Object.keys(final).filter(c => !['cree_le', 'modifie_le'].includes(c) && JSON.stringify(final[c] ?? null) !== JSON.stringify(avant[c] ?? null)) : null;
    for (const j of jonctions || []) if (JSON.stringify(jav[j.spec.n]) !== JSON.stringify(j.spec.t === 'pivot' ? B.pivot(j.spec, k) : B.liste(j.spec, k))) (champs || []).push(j.spec.n);
    if (!avant || champs.length) opts.journal({ table_nom: t, ligne_id: k, operation: avant ? 'UPDATE' : 'INSERT', champs });
  }
  return final;
}
function appliquerHeritier(B, H, opts = {}) {
  const avant = vide(H.id) ? null : B.get('heritiers', H.id);
  const id = vide(H.id) ? nouvelId(B, 'heritiers', H, opts.compteurs || {}) : H.id;
  const date = maintenant();
  const row = Object.fromEntries(COLS_HERITIER.map(c => [c, H[c] ?? null]));
  row.id = id; row.etalon = !!H.etalon; row.cree_le = (avant && avant.cree_le) || date; row.modifie_le = date;
  B.poser('heritiers', row);
  const sphAvant = JSON.stringify(B.rows('heritier_spheres').filter(s => s.heritier_id === id).map(s => [s.sphere_id, s.elevation_id]));
  const stAvant = JSON.stringify(B.pivot({ jonction: 'heritier_stats', fk: 'heritier_id', vers: 'stat_id', val: 'valeur' }, id));
  B.remplacerEnfants('heritier_spheres', 'heritier_id', id, (H.spheres || []).filter(s => !vide(s.sphere_id)).map((s, i) => ({ heritier_id: id, sphere_id: s.sphere_id, elevation_id: s.elevation_id, ordre: i + 1 })));
  B.remplacerEnfants('heritier_stats', 'heritier_id', id, Object.entries(H.stats || {}).filter(([, v]) => !vide(v)).map(([k, v]) => ({ heritier_id: id, stat_id: k, valeur: v })));
  if (opts.journal) {
    const champs = avant ? COLS_HERITIER.filter(c => c !== 'id' && JSON.stringify(row[c] ?? null) !== JSON.stringify(avant[c] ?? null)) : null;
    if (avant && sphAvant !== JSON.stringify(B.rows('heritier_spheres').filter(s => s.heritier_id === id).map(s => [s.sphere_id, s.elevation_id]))) champs.push('spheres');
    if (avant && stAvant !== JSON.stringify(B.pivot({ jonction: 'heritier_stats', fk: 'heritier_id', vers: 'stat_id', val: 'valeur' }, id))) champs.push('stats');

}
function planSuppression(B, t, cle) {
  const bloque = [], cascade = [], vus = new Set([t + ':' + cle]);
  const visiter = (tt, id) => {
    for (const ref of REFS) {
      if (ref.vers !== tt) continue;
      for (const r of B.rows(ref.de)) {
        if (r[ref.col] !== id) continue;
        const k = cleDe(ref.de, r), tag = ref.de + ':' + k;
        if (vus.has(tag)) continue;
        vus.add(tag);
        if (ref.cascade) { cascade.push({ t: ref.de, cle: k }); if (!CLES[ref.de]) visiter(ref.de, k); }
        else bloque.push({ t: ref.de, cle: k, col: ref.col });

    }
  };

  return { bloque, cascade };
}
function appliquerSuppression(B, t, cle, plan, journal) {
  for (const c of plan.cascade) B.retirer(c.t, c.cle);
  B.retirer(t, cle);
  if (journal) journal({ table_nom: t, ligne_id: cle, operation: 'DELETE', champs: null });
}

function erreurSupa(error, contexte) {
  const m = (error && (error.message || error.error_description || error.msg)) || String(error);
  let msg = m;
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) msg = 'Supabase injoignable : vérifie ta connexion et l’URL du projet.';
  else if (/JWT|apikey|Invalid API key/i.test(m)) msg = 'Clé publishable refusée : copie-la à nouveau depuis les réglages API du projet.';
  else if (/row-level security|permission denied/i.test(m)) msg = 'Accès refusé : ce compte n’est pas déclaré dans la table editeurs.';
  else if (/duplicate key/i.test(m)) msg = 'Doublon refusé par la base : ' + (error.details || m);
  else if (/foreign key/i.test(m)) msg = 'Référence refusée par la base : ' + (error.details || m);
  return new ErreurForge((contexte ? contexte + ' : ' : '') + msg);
}

    if (error) throw erreurSupa(error, 'Vérification du compte');

  async tout(t) {

  },
  async charger(progression) {

      const retraits = [...avant].filter(x => !voulu.has(x));
      if (ajouts.length) { const { error } = await DEPOT.client.from(s.jonction).insert(ajouts); if (error) throw erreurSupa(error, s.l); }
      if (retraits.length) { const { error } = await DEPOT.client.from(s.jonction).delete().eq(s.fk, id).in(s.vers, retraits); if (error) throw erreurSupa(error, s.l); }
    } else {
      const avant = BASE.pivot(s, id);
      const ecrire = Object.entries(valeurs).filter(([k, v]) => avant[k] !== v).map(([k, v]) => ({ [s.fk]: id, [s.vers]: k, [s.val]: v }));

  async supprimer(t, cle) {

    p.stats = Object.fromEntries(Object.entries(H.stats || {}).filter(([, v]) => !vide(v)));

/* ── API d’écriture utilisée par l’interface ── */
const Ecrire = {
  async ligne(t, E, ancienne) {
    const errs = validerEdition(BASE, t, E, ancienne);
    if (errs.length) throw new ErreurForge(errs);
    const { row, jonctions } = depuisEdition(t, E);
    if (DEPOT.mode === 'supabase') {
      let saved;
      try { saved = await Supa.ligne(t, row, jonctions, ancienne); }
      catch (e) { if (!vide(ancienne)) await Supa.recharger(t, ancienne).catch(() => {}); throw e; }
      appliquerLigne(BASE, t, saved, jonctions, ancienne);
      return cleDe(t, saved);
    }
    const final = appliquerLigne(BASE, t, row, jonctions, ancienne, { compteurs: DEPOT.compteurs, journal: e => Local.noter(e) });
    Local.persister();
    return cleDe(t, final);
  },
  async supprimer(t, cle) {
    const plan = planSuppression(BASE, t, cle);
    if (plan.bloque.length) throw new ErreurForge(`Suppression impossible : ${plan.bloque.length} élément${plan.bloque.length > 1 ? 's' : ''} y fai${plan.bloque.length > 1 ? 'ont' : 't'} référence.`);
    if (DEPOT.mode === 'supabase') { await Supa.supprimer(t, cle); appliquerSuppression(BASE, t, cle, plan); return; }
    appliquerSuppression(BASE, t, cle, plan, e => Local.noter(e));
    Local.persister();
  },
  async heritier(H) {
    const errs = validerHeritier(BASE, H).filter(x => x.niv === 'erreur');
    if (errs.length) throw new ErreurForge(errs.map(x => x.msg));
    if (DEPOT.mode === 'supabase') return Supa.heritier(H);
    const id = appliquerHeritier(BASE, H, { compteurs: DEPOT.compteurs, journal: e => Local.noter(e) });
    Local.persister();
    return id;
  },
};

/* ── Contrôles du registre (P9) ── */
function controlesRegistre(B) {
  const hs = B.rows('heritiers');
  const invalides = [], incomplets = [];
  for (const h of hs) {
    const v = validerHeritier(B, heritierDepuisBase(B, h.id));
    if (v.some(x => x.niv === 'erreur')) invalides.push({ h, msgs: v.filter(x => x.niv === 'erreur').map(x => x.msg) });
    else if (v.some(x => x.niv === 'afaire')) incomplets.push({ h, msgs: v.filter(x => x.niv === 'afaire').map(x => x.msg) });
  }
  const proches = [], actifs = hs.filter(h => h.statut !== 'retire');
  for (let i = 0; i < actifs.length; i++) for (let j = i + 1; j < actifs.length; j++) {
    const a = actifs[i], b = actifs[j];
    const pa = new Set(CHAMPS_POUVOIRS.map(([c]) => a[c]).filter(Boolean));
    const communs = CHAMPS_POUVOIRS.map(([c]) => b[c]).filter(x => x && pa.has(x));
    if (communs.length >= 3) proches.push({ a, b, n: communs.length });
  }
  const utilises = new Set(hs.flatMap(h => CHAMPS_POUVOIRS.map(([c]) => h[c])));
  const inutilises = {
    pouvoirs: B.trie('pouvoirs').filter(p => !utilises.has(p.id)),
    spheresSansPouvoir: B.trie('spheres').filter(s => !B.rows('pouvoirs').some(p => p.sphere_id === s.id)),
    spheresNonHeritables: B.trie('spheres').filter(s => !B.rows('entite_spheres').some(x => x.sphere_id === s.id)),
    entitesSansSphere: B.trie('entites').filter(e => !B.liste(LS_ENTITE, e.id).length),
    vocationsSansProfil: B.trie('vocations').filter(v => !Object.keys(B.pivot(PV_VOCATION, v.id)).length),
    statsSansReference: B.trie('stats').filter(s => vide(s.valeur_ref)),
  };
  const traductions = [];
  for (const t of Object.keys(META)) {
    const cols = META[t].cols.filter(c => c.en);

    if (n) traductions.push({ t, n });
  }
  return { invalides, incomplets, proches, inutilises, traductions };
}

function autoPossible() {
  const st = BASE.rows('stats').filter(s => !vide(s.valeur_ref));

// Auto provisoire, en attendant l’IP : valeur de référence × poids du profil de la vocation (moyenne des poids = 1).
function appliquerAuto(h) {
  const st = BASE.trie('stats').filter(s => !vide(s.valeur_ref));
  const prof = h.vocation_id ? BASE.pivot(PV_VOCATION, h.vocation_id) : {};
  const poids = st.map(s => prof[s.id]).filter(x => !vide(x));
  const moy = poids.length ? poids.reduce((a, b) => a + b, 0) / poids.length : 1;
  for (const s of st) {
    const w = vide(prof[s.id]) || !(moy > 0) ? 1 : prof[s.id] / moy;
    let v = s.valeur_ref * w;
    if (!vide(s.min)) v = Math.max(s.min, v);
    if (!vide(s.max)) v = Math.min(s.max, v);
    h.stats[s.id] = arrondi(v);
  }
}
function generer(champs) {
  const B = BASE, f = F(), h = f.h;
  const doit = k => (champs ? champs.includes(k) : !f.verrous[k]);
  const slots = ajusterSpheres(h);
  if (doit('elevation')) h.elevation_depart_id = (piocher(B.rows('elevations')) || {}).id || null;
  if (doit('entite')) {
    const c = B.rows('entites').filter(e => (!f.filtres.pantheon || e.pantheon_id === f.filtres.pantheon) && (!f.filtres.type || e.type_id === f.filtres.type) && B.liste(LS_ENTITE, e.id).length);
    h.entite_id = (piocher(c) || {}).id || null;
  }
  const herit = spheresHeritees(h);
  const prises = new Set(h.spheres.filter((s, i) => !doit('sphere:' + i) && s.sphere_id).map(s => s.sphere_id));
  slots.forEach((s, i) => {
    if (!doit('sphere:' + i)) return;
    const pool = (contrainteDe(i) ? herit : B.rows('spheres').map(x => x.id)).filter(x => !prises.has(x));
    h.spheres[i].sphere_id = piocher(pool);
    if (h.spheres[i].sphere_id) prises.add(h.spheres[i].sphere_id);
  });
  if (herit.length && !h.spheres.some(s => herit.includes(s.sphere_id))) {
    const i = h.spheres.findIndex((s, j) => doit('sphere:' + j));
    const pool = herit.filter(x => !h.spheres.some(s => s.sphere_id === x));
    if (i >= 0 && pool.length) h.spheres[i].sphere_id = piocher(pool);
  }
  const ens = new Set(h.spheres.map(s => s.sphere_id).filter(Boolean));
  const tirerPouvoir = (champ, emp, exclus) => {
    const pool = B.rows('pouvoirs').filter(p => p.emplacement === emp && ens.has(p.sphere_id) && p.id !== exclus);
    h[champ] = (piocher(pool) || {}).id || null;
  };
  if (doit('passif')) tirerPouvoir('passif_id', 'passif');
  if (doit('pouvoir_1')) tirerPouvoir('pouvoir_1_id', 'pouvoir', h.pouvoir_2_id);
  if (doit('pouvoir_2')) tirerPouvoir('pouvoir_2_id', 'pouvoir', h.pouvoir_1_id);
  if (doit('ultime')) tirerPouvoir('ultime_id', 'ultime');
  if (doit('vocation')) h.vocation_id = (piocher(B.rows('vocations')) || {}).id || null;
  if (doit('ciblage')) h.ciblage_id = (piocher(B.rows('ciblages').filter(c => c.camp === 'ennemi')) || {}).id || null;
  if (doit('nom')) h.nom_id = (piocher(nomsCompatibles(h, f.genre)) || {}).id || null;

  return `${manquent.length ? `<div class="bandeau info"><span>Pour forger un Héritier complet, il manque encore ${manquent.join(', ')}.</span><button class="btn" data-a="aller" data-v="listes">Ouvrir les listes</button>${DEPOT.mode === 'local' && !B.rows('entites').length ? '<button class="btn discret" data-a="r-exemple">Charger des données d’exemple</button>' : ''}</div>` : ''}

        <button class="btn prim" data-a="f-enregistrer">${ICO.disque} Enregistrer</button></div>

function coteForge() {
  const B = BASE, f = F(), h = f.h;
  const ent = B.get('entites', h.entite_id), nom = B.get('noms', h.nom_id), pan = ent && B.get('pantheons', ent.pantheon_id);
  const pc = pan && pan.couleur ? pan.couleur : '';
  const pouvoir = (c, lib) => {
    const p = B.get('pouvoirs', h[c]);
    if (!p) return `<li><span class="emp">${lib}</span><span class="vide">À choisir</span></li>`;
    const sc = couleurDe('spheres', p.sphere_id);
    const meta = [libId(B, 'spheres', p.sphere_id), p.emplacement === 'pouvoir' ? `recharge ${nombreFr(p.recharge_s)} s` : p.emplacement === 'ultime' ? `énergie ${nombreFr(p.energie_requise)}` : libId(B, 'declencheurs', p.declencheur_id)].filter(Boolean).join(' · ');
    return `<li${sc ? ` style="--c:${sc}"` : ''}><span class="emp">${lib}</span><b>${esc(p.nom_fr)}</b><span class="meta">${esc(meta)}</span>${p.texte_modele_fr ? `<p>${esc(p.texte_modele_fr)}</p>` : ''}</li>`;
  };
  const fiche = `<article class="fiche"${pc ? ` style="--pc:${pc}"` : ''}>
    <p class="fiche-sur">${badgeElev(h.elevation_depart_id) || '<span>Élévation à choisir</span>'}${pan ? `<span>${esc(pan.nom_fr)}</span>` : ''}${ent ? `<span>${esc(libId(B, 'types_heritage', ent.type_id))}</span>` : ''}</p>
    <h2 class="${nom ? '' : 'sans'}">${esc(nom ? nom.nom : 'Sans nom')}</h2>
    ${ent ? `<p class="fiche-enfant">${esc(enfantDeFr(ent))}<span>${esc(enfantDeEn(ent))}</span></p>` : ''}
    <dl><dt>Vocation</dt><dd>${esc(libId(B, 'vocations', h.vocation_id)) || '—'}</dd><dt>Ciblage</dt><dd>${esc(libId(B, 'ciblages', h.ciblage_id)) || '—'}</dd>
      <dt>Sphères</dt><dd class="puces">${h.spheres.filter(s => s.sphere_id).map(s => puceSphere(s.sphere_id, ` · ${esc(libId(B, 'elevations', s.elevation_id))}`)).join('') || '—'}</dd></dl>
    <ul class="fiche-pouvoirs">${pouvoir('passif_id', 'Passif')}${pouvoir('pouvoir_1_id', 'Pouvoir 1')}${pouvoir('pouvoir_2_id', 'Pouvoir 2')}${pouvoir('ultime_id', 'Ultime')}</ul>
  </article>`;

  const msgs = validerHeritier(B, h);
  const pa = new Set(CHAMPS_POUVOIRS.map(([c]) => h[c]).filter(Boolean));
  for (const x of B.rows('heritiers')) {
    if (x.id === h.id || x.statut === 'retire') continue;
    const n = CHAMPS_POUVOIRS.map(([c]) => x[c]).filter(p => p && pa.has(p)).length;
    if (n >= 3) msgs.push({ niv: 'alerte', msg: `Très proche de ${x.id} ${libHeritier(B, x)} : ${n} pouvoirs sur 4 en commun.` });
  }
  const ordre = { erreur: 0, afaire: 1, alerte: 2 };
  msgs.sort((a, b) => ordre[a.niv] - ordre[b.niv]);
  const ctrl = `<section class="panneau"><h3>Contrôles <small>${msgs.filter(m => m.niv === 'erreur').length} erreur(s) · ${msgs.filter(m => m.niv === 'afaire').length} à compléter</small></h3>
    ${f.erreurs ? `<ul class="msgs">${f.erreurs.map(m => `<li class="erreur">${esc(m)}</li>`).join('')}</ul>` : ''}
    ${msgs.length ? `<ul class="msgs">${msgs.map(m => `<li class="${m.niv}">${esc(m.msg)}</li>`).join('')}</ul>` : `<ul class="msgs"><li class="ok">Toutes les règles sont respectées.</li></ul>`}
    ${h.statut === 'brouillon' && msgs.some(m => m.niv === 'afaire') ? '<p style="font-size:13px;color:var(--brume)">En brouillon, ces points n’empêchent pas d’enregistrer.</p>' : ''}</section>`;

  const pairs = B.rows('heritiers').filter(x => x.id !== h.id && x.statut !== 'retire' && x.elevation_depart_id === h.elevation_depart_id);
  const lignes = B.trie('stats').map(s => {
    const vals = pairs.map(x => B.rows('heritier_stats').find(r => r.heritier_id === x.id && r.stat_id === s.id)).filter(Boolean).map(r => r.valeur).sort((a, b) => a - b);
    const v = h.stats[s.id];
    if (!vals.length) return '';
    const med = vals.length % 2 ? vals[(vals.length - 1) / 2] : (vals[vals.length / 2 - 1] + vals[vals.length / 2]) / 2;
    const tous = vide(v) || !Number.isFinite(v) ? vals : [...vals, v];
    let a = Math.min(...tous), b = Math.max(...tous);
    if (a === b) { a -= 1; b += 1; }
    const x = val => ((val - a) / (b - a)) * 100;
    return `<div class="comp-l"><span>${esc(s.abreviation_fr || s.id)}</span>
      <div class="comp-barre" title="Minimum ${nombreFr(vals[0])}, médiane ${nombreFr(arrondi(med))}, maximum ${nombreFr(vals.at(-1))}">
        <span class="plage" style="left:${x(vals[0])}%;width:${Math.max(1, x(vals.at(-1)) - x(vals[0]))}%"></span><span class="med" style="left:${x(med)}%"></span>
        ${vide(v) || !Number.isFinite(v) ? '' : `<span class="moi" style="left:${x(v)}%"></span>`}</div>
      <span class="v">${vide(v) ? '—' : nombreFr(v)}</span></div>`;
  }).filter(Boolean);
  const eq = `<section class="panneau"><h3>Équilibrage</h3>
    <ul class="msgs"><li class="alerte">Indice de puissance : à définir ensemble (P7). La comparaison ci-dessous porte sur les stats saisies.</li></ul>
    ${lignes.length ? `<p class="legende-comp"><span><i style="width:14px;height:4px;background:var(--filet-fort)"></i>Plage du registre</span><span><i style="width:2px;height:12px;background:var(--brume)"></i>Médiane</span><span><i style="width:10px;height:10px;border-radius:50%;background:var(--or)"></i>Cet Héritier</span></p>
      <p style="font-size:13px;color:var(--brume)">Comparé à ${pairs.length} Héritier${pairs.length > 1 ? 's' : ''} de départ ${esc(libId(B, 'elevations', h.elevation_depart_id))}.</p><div class="comp">${lignes.join('')}</div>`
      : `<p style="font-size:13px;color:var(--brume)">${h.elevation_depart_id ? `Aucun autre Héritier de départ ${esc(libId(B, 'elevations', h.elevation_depart_id))} avec des stats pour comparer.` : 'Choisis une élévation de départ pour comparer les stats au registre.'}</p>`}
  </section>`;
  return fiche + ctrl + eq;
}
function rafraichirCote() { const c = $('#forge-cote'); if (c) c.innerHTML = coteForge(); const m = $('.barre-forge .modifie'); const doit = forgeModifiee(); if (!!m !== doit) rendre(); }

async function enregistrerForge() {
  const f = F();
  f.erreurs = null;
  try {
    const id = await occuper('Enregistrement…', () => Ecrire.heritier(f.h));
    ouvrirHeritier(id);
    notifier(`${libHeritier(BASE, BASE.get('heritiers', id))} enregistré sous ${id}.`);
  } catch (e) {
    f.erreurs = messagesErreur(e);
    notifier('Enregistrement refusé : voir les contrôles.', 'erreur');
  }
  rendre();
}

      <select data-c="h-filtre" data-k="statut" aria-label="Statut">${options(STATUTS.map(([v, l]) => ({ v, l })), x.statut, 'Tous les statuts')}</select>

    case 'constantes': return `${nombreFr(r.valeur)} ${r.unite || ''}`;
    default: return r.description_fr || '';

const manqueEn = (t, r) => META[t].cols.some(c => c.en && !vide(r[c.n.replace(/_en$/, '_fr')]) && vide(r[c.n]));

    }
    case 'ref': return `<label class="champ"><span>${lab}</span><select id="${id}" data-c="l-champ" data-k="${c.n}" data-focus="${id}">${options(B.trie(c.table).map(r => ({ v: cleDe(c.table, r), l: libRow(B, c.table, r) + (CLES[c.table] ? '' : ` (${cleDe(c.table, r)})`) })), v, c.req ? 'Choisir…' : 'Aucun')}</select></label>`;
    case 'liste': return `<div class="champ large"><span>${lab}</span><div class="choix-multi" role="group" aria-label="${esc(c.l)}">${B.trie(c.table).map(r => { const on = (v || []).includes(r.id); return `<button data-a="l-liste" data-k="${c.n}" data-v="${esc(r.id)}" aria-pressed="${on}"${r.couleur ? ` style="--c:${r.couleur}"` : ''}>${esc(libRow(B, c.table, r))}</button>`; }).join('') || `<span style="color:var(--brume);font-size:13px">Liste ${esc(TITRES[c.table].toLowerCase())} vide.</span>`}</div></div>`;
    case 'pivot': return `<div class="champ large"><span>${lab}</span><div class="pivot">${B.trie(c.table).map(r => `<label>${esc(libRow(B, c.table, r))}<input type="text" inputmode="decimal" value="${esc(nombreFr((v || {})[r.id]))}" data-i="l-pivot" data-k="${c.n}" data-v="${esc(r.id)}" data-focus="pv-${c.n}-${esc(r.id)}"></label>`).join('') || `<span style="color:var(--brume);font-size:13px">Liste ${esc(TITRES[c.table].toLowerCase())} vide.</span>`}</div></div>`;
    case 'poly': {
      const p = v || { type: '', id: '' }, ch = c.choix[p.type];
      const rows = ch ? B.trie(ch.table).filter(r => !ch.filtre || ch.filtre(r)) : [];
      return `<div class="champ large"><span>${lab}</span><div class="deux"><select data-c="l-poly-type" data-k="${c.n}" aria-label="${esc(c.l)} : type" data-focus="pt-${c.n}">${options(Object.entries(c.choix).map(([k, x]) => ({ v: k, l: x.l })), p.type, 'Type…')}</select>
        <select data-c="l-poly-id" data-k="${c.n}" aria-label="${esc(c.l)}" data-focus="pi-${c.n}" ${ch ? '' : 'disabled'}>${options(rows.map(r => ({ v: cleDe(ch.table, r), l: libRow(B, ch.table, r) })), p.id, 'Choisir…')}</select></div></div>`;
    }
  }
  return '';
}
function formulaireLigne() {
  const B = BASE, L = UI.L, t = L.table, m = META[t], E = L.E, nouveau = vide(L.cle);
  const champs = m.cols.filter(c => !c.si || c.si(E)).map(c => champHtml(t, c, E, nouveau)).join('');
  let enfants = '', usage = '';
  if (!nouveau) {
    for (const en of m.enfants || []) {
      const rows = en.poly ? B.trie(en.table).filter(r => r[META[en.table].cols.find(c => c.n === en.poly.col).choix[en.poly.type].col] === L.cle) : B.trie(en.table).filter(r => r[en.fk] === L.cle);
      enfants += `<div class="sous-liste"><h3>${esc(en.titre)} (${rows.length})</h3><ul>${rows.map(r => `<li><button data-a="l-enfant" data-t="${en.table}" data-k="${esc(cleDe(en.table, r))}"><span>${esc(libRow(B, en.table, r))}</span><span class="mono">${esc(cleDe(en.table, r))}</span></button></li>`).join('')}</ul>
        <div><button class="btn discret" data-a="l-enfant-nouveau" data-t="${en.table}" data-fk="${en.fk}" data-poly="${en.poly ? en.poly.col + ':' + en.poly.type : ''}">${ICO.plus} Ajouter</button></div></div>`;
    }
    const plan = planSuppression(B, t, L.cle);
    const parTable = {};
    for (const x of [...plan.bloque, ...plan.cascade]) parTable[x.t] = (parTable[x.t] || 0) + 1;
    const heritiers = plan.bloque.filter(x => x.t === 'heritiers');
    usage = `<div class="sous-liste"><h3>Utilisé par</h3>${Object.keys(parTable).length ? `<p style="font-size:14px">${Object.entries(parTable).map(([k, n]) => `${n} × ${esc(TITRES[k] || k)}`).join(' · ')}</p>` : '<p style="font-size:14px;color:var(--brume)">Rien ne fait référence à cet élément.</p>'}
      ${heritiers.length ? `<ul>${heritiers.slice(0, 12).map(x => `<li><button data-a="go-heritier" data-id="${esc(x.cle)}"><span>${esc(libId(B, 'heritiers', x.cle))}</span><span class="mono">${esc(x.cle)}</span></button></li>`).join('')}</ul>` : ''}</div>`;
  }
  const plan = !nouveau && planSuppression(B, t, L.cle);
  const apercu = m.apercu ? `<p class="apercu" id="l-apercu">${esc(m.apercu(E))}</p>` : '';
  return `<div class="formulaire">
    <div class="formulaire-tete">${L.retour ? `<button class="btn discret" data-a="l-retour">← ${esc(libId(B, L.retour.t, L.retour.cle))}</button>` : ''}<h2>${nouveau ? 'Nouvel élément' : esc(libRow(B, t, B.get(t, L.cle)))}</h2>${nouveau ? '' : `<span class="mono">${esc(L.cle)}</span>`}</div>
    ${L.erreurs.length ? `<ul class="msgs">${L.erreurs.map(e => `<li class="erreur">${esc(e)}</li>`).join('')}</ul>` : ''}
    <div class="grille-champs">${champs}</div>${apercu}${enfants}${usage}
    <div class="actions"><button class="btn prim" data-a="l-enregistrer">${ICO.disque} Enregistrer</button><button class="btn discret" data-a="l-annuler">Fermer</button><span class="espace"></span>
      ${nouveau ? '' : plan.bloque.length ? `<span style="font-size:13px;color:var(--brume)">Suppression impossible tant qu’il est utilisé.</span>`
        : L.confirm ? `<button class="btn danger arme" data-a="l-suppr-ok">Confirmer${plan.cascade.length ? ` (et ${plan.cascade.length} élément${plan.cascade.length > 1 ? 's' : ''} lié${plan.cascade.length > 1 ? 's' : ''})` : ''}</button><button class="btn discret" data-a="l-suppr-non">Annuler</button>`
        : '<button class="btn danger" data-a="l-suppr">Supprimer</button>'}</div></div>`;
}

    ${X.sim.ok ? `<div class="actions"><button class="btn prim" data-a="x-appliquer">${ICO.haut} Appliquer l’import</button><span style="font-size:13px;color:var(--brume)">${DEPOT.mode === 'supabase' ? 'Écrit dans Supabase.' : 'Écrit dans la base locale.'}</span></div>`

  <div class="cartes">
    <section class="panneau"><h3>Importer des TSV</h3>

        <label class="btn">${ICO.haut} Choisir des fichiers<input type="file" accept=".tsv,.txt,text/tab-separated-values" multiple data-c="x-fichiers" hidden></label></div>
      ${X.lots.length ? `<ul class="fichiers">${X.lots.map((l, i) => `<li><span>${esc(l.fichier)} · ${l.lignes.length} ligne${l.lignes.length > 1 ? 's' : ''}</span>

        <button class="btn discret" data-a="x-retirer" data-i="${i}">Retirer</button></li>`).join('')}</ul>
        <div class="actions"><button class="btn prim" data-a="x-analyser" ${X.lots.every(l => l.table) ? '' : 'disabled'}>Analyser</button><button class="btn discret" data-a="x-vider">Tout retirer</button>
          <span style="font-size:13px;color:var(--brume)">L’analyse ne modifie rien.</span></div>` : ''}
      ${rapport}
      <p style="font-size:13px;color:var(--brume)">Une ligne avec un identifiant existant met à jour cet élément ; seules les colonnes présentes dans le fichier changent. Un fichier avec juste <code>id</code> et <code>nom_en</code> sert donc à importer des traductions.</p>
    </section>
    <section class="panneau"><h3>Exporter en TSV</h3>
      <div class="actions"><button class="btn prim" data-a="x-export-tout">${ICO.bas} Tout exporter (.zip)</button></div>
      <div class="export-grille">${TABLES_ECHANGE.map(t => `<button class="btn" data-a="x-export" data-t="${t}">${esc(TITRES[t])}<span class="mono">${B.rows(t).length}</span></button>`).join('')}</div>
    </section>

      <p style="font-size:14px">Fichier JSON des ${enJeu} Héritier${enJeu > 1 ? 's' : ''} « en jeu » et de tout ce qu’ils utilisent, à livrer avec le jeu publié. Ni brouillons, ni notes, ni journal.</p>
      <div class="actions"><label class="champ" style="width:120px"><span>Version</span><input type="text" inputmode="numeric" value="${esc(X.version)}" data-i="x-version" data-focus="xv"></label>
        <button class="btn prim" data-a="x-build" style="align-self:end" ${enJeu ? '' : 'disabled'}>${ICO.bas} Générer le build</button></div>
      ${derniere ? `<p style="font-size:13px;color:var(--brume)">Dernier build généré : version ${derniere}.</p>` : ''}

}
async function lireFichiers(fichiers) {
  for (const f of fichiers) {
    const texte = await f.text();
    const { entetes, lignes } = lireTSV(texte);
    const nom = f.name.replace(/\.(tsv|txt)$/i, '').toLowerCase().replace(/[^a-z_]/g, '');
    UI.X.lots.push({ fichier: f.name, table: TABLES_ECHANGE.includes(nom) ? nom : '', entetes, lignes });
  }
  UI.X.sim = null;
  rendre();
}

  const J = UI.J;
  const entrees = DEPOT.mode === 'local' ? [...DEPOT.journal].reverse().slice(0, 300) : J.entrees;
  if (DEPOT.mode === 'supabase' && !J.entrees && !J.erreur) { chargerJournal(); return '<p>Chargement du journal…</p>'; }

  return `<div class="vue-tete"><h1>Journal</h1><span class="sous">${DEPOT.mode === 'local' ? 'Base locale' : 'Supabase'} · 300 dernières modifications</span><span class="espace"></span>${DEPOT.mode === 'supabase' ? '<button class="btn" data-a="j-actualiser">Actualiser</button>' : ''}</div>
    ${J.erreur ? `<div class="bandeau err">${esc(J.erreur)}</div>` : ''}
    ${entrees && entrees.length ? `<div class="tab-wrap"><table class="tab"><thead><tr><th>Date</th><th>Registre</th><th>Élément</th><th>Opération</th><th>Champs</th></tr></thead><tbody>
      ${entrees.map(e => `<tr><td class="num">${esc(new Date(e.date).toLocaleString('fr-FR'))}</td><td>${esc(TITRES[e.table_nom] || e.table_nom)}</td><td class="mono">${esc(e.ligne_id)}</td><td>${esc(op[e.operation] || e.operation)}</td><td>${esc((e.champs || []).join(', '))}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="vide-etat"><h2>Aucune modification enregistrée</h2></div>'}`;

async function chargerJournal() {
  try { UI.J.entrees = await Supa.journal(); UI.J.erreur = null; } catch (e) { UI.J.erreur = messagesErreur(e).join(' '); UI.J.entrees = []; }
  if (UI.vue === 'journal') rendre();
}

async function connecterSupabase(silencieux) {
  const R = UI.R;
  if (!Supa.pret()) throw new ErreurForge('Bibliothèque Supabase indisponible.');
  ecrireReglages({ url: R.url, cle: R.cle, email: R.email });
  Supa.creer(R.url.trim(), R.cle.trim());
  if (!silencieux) await Supa.connecter(R.email.trim(), R.mdp);
  else if (!(await Supa.session())) return false;
  if (!(await Supa.verifierEditeur())) {
    R.msg = { type: 'afaire', html: `Connecté, mais ce compte n’est pas déclaré éditeur. Dans l’éditeur SQL de Supabase, exécute :<div class="mono-bloc">insert into editeurs (user_id, email)\nselect id, email from auth.users where email = '${esc(DEPOT.utilisateur.email)}';</div>Puis reconnecte-toi.` };
    return false;
  }
  await chargerSupabase();
  return true;
}
async function chargerSupabase() {
  BASE = await occuper('Chargement des registres…', () => Supa.charger((i, n) => { UI.occupe = `Chargement des registres… ${i} / ${n}`; rendreVoile(); }));
  DEPOT.pret = true; UI.R.mdp = ''; UI.R.msg = null; UI.J.entrees = null;
  ajusterSpheres(F().h);
}
async function changerSource(src) {
  ecrireReglages({ source: src });
  DEPOT.mode = src; DEPOT.pret = false;
  if (src === 'local') { BASE = Local.charger(); DEPOT.pret = true; }
  else {
    BASE = new Base();
    if (Supa.pret() && UI.R.url && UI.R.cle) { try { await connecterSupabase(true); } catch (e) { UI.R.msg = { type: 'err', html: esc(messagesErreur(e).join(' ')) }; } }

  UI.L.E = null; UI.L.cle = null; UI.X.sim = null;
  ajusterSpheres(F().h);
}

/* ═════════════ Données d’exemple (base locale) ═════════════ */
async function ajouterExemples() {
  const B = BASE, D = 'Exemple.';
  const assure = async (t, init) => { const k = cleDe(t, init); if (!vide(init.id) && B.get(t, k)) return k; return Ecrire.ligne(t, nouvelleEdition(t, { description_fr: D, ...init })); };
  for (const [id, n, en, c] of [['grec', 'Grec', 'Greek', '#D9C9A0'], ['nordique', 'Nordique', 'Norse', '#8FB8E0']]) await assure('pantheons', { id, nom_fr: n, nom_en: en, couleur: c });
  const sph = [['foudre', 'Foudre', 'Lightning', '#E8D35A'], ['ciel', 'Ciel', 'Sky', '#7FB3E8'], ['guerre', 'Guerre', 'War', '#D9634F'], ['sagesse', 'Sagesse', 'Wisdom', '#B9A3E3'],
    ['forge', 'Forge', 'Forge', '#E08A3C'], ['mer', 'Mer', 'Sea', '#3FB6A8'], ['givre', 'Givre', 'Frost', '#BFE3F2'], ['runes', 'Runes', 'Runes', '#9C8BD0']];
  for (const [id, n, en, c] of sph) await assure('spheres', { id, nom_fr: n, nom_en: en, couleur: c });
  const ents = [['Zeus', 'Zeus', 'M', 'aucun', false, 'aucun', 'grec', 'dieu', ['foudre', 'ciel']], ['Athéna', 'Athena', 'F', 'aucun', true, 'aucun', 'grec', 'dieu', ['sagesse', 'guerre']],
    ['Héphaïstos', 'Hephaestus', 'M', 'aucun', true, 'aucun', 'grec', 'dieu', ['forge', 'foudre']], ['Poséidon', 'Poseidon', 'M', 'aucun', false, 'aucun', 'grec', 'dieu', ['mer', 'ciel']],
    ['Thor', 'Thor', 'M', 'aucun', false, 'aucun', 'nordique', 'dieu', ['foudre', 'guerre']], ['Odin', 'Odin', 'M', 'aucun', true, 'aucun', 'nordique', 'dieu', ['runes', 'sagesse']],
    ['Ymir', 'Ymir', 'M', 'aucun', true, 'aucun', 'nordique', 'titan', ['givre', 'guerre']]];
  for (const [nom_fr, nom_en, genre, determinant_fr, elision_fr, article_en, pantheon_id, type_id, spheres] of ents)
    if (!B.rows('entites').some(e => e.nom_fr === nom_fr && e.pantheon_id === pantheon_id)) await assure('entites', { nom_fr, nom_en, genre, determinant_fr, elision_fr, article_en, pantheon_id, type_id, spheres });
  await assure('origines', { id: 'grecque', nom_fr: 'Grecque', nom_en: 'Greek', pantheons: ['grec'] });
  await assure('origines', { id: 'nordique', nom_fr: 'Nordique', nom_en: 'Norse', pantheons: ['nordique'] });
  const noms = [['Kallias', 'grecque', 'M'], ['Thaléia', 'grecque', 'F'], ['Néréa', 'grecque', 'F'], ['Démétrios', 'grecque', 'M'], ['Sigrun', 'nordique', 'F'], ['Hrafn', 'nordique', 'M'],
    ['Eira', 'nordique', 'F'], ['Bjarki', 'nordique', 'M'], ['Sam', 'commune', 'E'], ['Léa', 'commune', 'F'], ['Malo', 'commune', 'M']];
  for (const [nom, origine_id, genre] of noms) if (!B.rows('noms').some(n => n.nom === nom && n.origine_id === origine_id)) await Ecrire.ligne('noms', nouvelleEdition('noms', { nom, origine_id, genre }));
  const ref = { pv: 100, atk: 10, vitesse: 1, critique: 5, degats_critiques: 1.5, recharge: 0, energie: 0, menace: 1 };
  for (const [id, v] of Object.entries(ref)) { const s = B.get('stats', id); if (s && vide(s.valeur_ref)) await Ecrire.ligne('stats', { ...versEdition(B, 'stats', s), valeur_ref: v }, id); }
  const voc = [['guerrier', 'Guerrier', 'Warrior', { pv: 1.1, atk: 1.4, critique: 1.2, menace: 1 }], ['gardien', 'Gardien', 'Guardian', { pv: 1.6, atk: 0.7, menace: 2 }],
    ['sage', 'Sage', 'Sage', { pv: 0.8, atk: 1.3, energie: 1.5 }], ['guerisseur', 'Guérisseur', 'Healer', { pv: 0.9, atk: 0.8, recharge: 1.4 }]];
  for (const [id, n, en, profil] of voc) await assure('vocations', { id, nom_fr: n, nom_en: en, profil });
  const pouv = { foudre: ['Peau électrique', 'Éclair', 'Arc voltaïque', 'Colère céleste'], ciel: ['Vent porteur', 'Rafale', 'Nuée', 'Tempête'], guerre: ['Soif de bataille', 'Charge', 'Cri de guerre', 'Carnage'],
    sagesse: ['Prescience', 'Stratagème', 'Parole d’autorité', 'Plan parfait'], forge: ['Peau de bronze', 'Marteau', 'Étincelles', 'Coulée ardente'], mer: ['Marée montante', 'Vague', 'Tourbillon', 'Raz-de-marée'],
    givre: ['Cœur de glace', 'Gel', 'Pic de glace', 'Hiver sans fin'], runes: ['Rune de garde', 'Rune de feu', 'Rune de lien', 'Chant des runes'] };
  for (const [s, [pa, p1, p2, ul]] of Object.entries(pouv)) {
    if (B.rows('pouvoirs').some(p => p.sphere_id === s && p.description_fr === D)) continue;
    await Ecrire.ligne('pouvoirs', nouvelleEdition('pouvoirs', { nom_fr: pa, emplacement: 'passif', sphere_id: s, declencheur_id: 'permanent', description_fr: D, texte_modele_fr: 'Exemple de passif.' }));
    await Ecrire.ligne('pouvoirs', nouvelleEdition('pouvoirs', { nom_fr: p1, emplacement: 'pouvoir', sphere_id: s, recharge_s: 6, description_fr: D, texte_modele_fr: 'Exemple de pouvoir.' }));
    await Ecrire.ligne('pouvoirs', nouvelleEdition('pouvoirs', { nom_fr: p2, emplacement: 'pouvoir', sphere_id: s, recharge_s: 9, description_fr: D, texte_modele_fr: 'Exemple de pouvoir.' }));
    await Ecrire.ligne('pouvoirs', nouvelleEdition('pouvoirs', { nom_fr: ul, emplacement: 'ultime', sphere_id: s, energie_requise: 100, description_fr: D, texte_modele_fr: 'Exemple d’ultime.' }));
  }
}

/* ═════════════ Rendu général ═════════════ */
const VUES = { forge: vueForge, heritiers: vueHeritiers, listes: vueListes, echanges: vueEchanges, controles: vueControles, journal: vueJournal, reglages: vueReglages };
const ONGLETS = [['forge', 'Forge'], ['heritiers', 'Héritiers'], ['listes', 'Listes'], ['echanges', 'Échanges'], ['controles', 'Contrôles'], ['journal', 'Journal'], ['reglages', 'Réglages']];
function rendreEntete() {
  const sup = DEPOT.mode === 'supabase';
  const etat = sup ? (DEPOT.pret ? 'connecte' : 'deconnecte') : 'local';
  const lib = sup ? (DEPOT.pret ? `Supabase · ${DEPOT.utilisateur ? DEPOT.utilisateur.email : ''}` : 'Supabase · non connecté') : 'Base locale';
  $('#onglets').innerHTML = ONGLETS.map(([k, l]) => `<button data-a="aller" data-v="${k}" aria-current="${UI.vue === k ? 'page' : 'false'}">${l}${k === 'heritiers' ? `<span class="compte">${BASE.rows('heritiers').length}</span>` : ''}</button>`).join('');
  $('#source').className = 'source ' + etat;
  $('#source').innerHTML = `<i></i>${esc(lib)}`;
}
function rendre() {
  const act = document.activeElement, focus = act && act.dataset ? act.dataset.focus : null;
  const pos = act && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;
  rendreEntete();
  $('#vue').innerHTML = VUES[UI.vue]();
  if (focus) {
    const el = $(`[data-focus="${CSS.escape(focus)}"]`);
    if (el) { el.focus({ preventScroll: true }); if (pos && typeof el.setSelectionRange === 'function') try { el.setSelectionRange(pos[0], pos[1]); } catch (e) { /* champ sans sélection */ } }
  }
  if (UI.vue === 'echanges') brancherDepot();
}
function brancherDepot() {
  const d = $('#depot');
  if (!d) return;
  d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('survol'); });
  d.addEventListener('dragleave', () => d.classList.remove('survol'));
  d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('survol'); lireFichiers([...e.dataTransfer.files]); });
}
